<!DOCTYPE html>
<!-- python3 -m http.server 5500 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Ended Queue (Deque) – Circular Array Animation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0b0f19;
    --surface: #141b2d;
    --surface-2: #1c2538;
    --border: #2a3548;
    --primary: #6366f1;
    --primary-glow: #818cf8;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --front: #38bdf8;
    --rear: #a78bfa;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    background-image: 
      radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
  }

  .container {
    max-width: 960px;
    width: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .made-by {
    display: inline-block;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(167, 139, 250, 0.2));
    border: 1px solid rgba(129, 140, 248, 0.3);
    color: #c4b5fd;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
    letter-spacing: 0.4px;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #818cf8, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .badge {
    display: inline-block;
    background: rgba(99, 102, 241, 0.15);
    color: var(--primary-glow);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  /* ===== Visualization Card ===== */
  .viz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px 20px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
  }

  .array-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px 0 28px;
    position: relative;
    flex-wrap: wrap;
  }

  .slot {
    width: 78px;
    height: 78px;
    background: var(--surface-2);
    border: 2px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  .slot.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }

  .slot .index {
    position: absolute;
    top: 4px;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .slot .value {
    font-size: 1.45rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .slot.filled .value {
    opacity: 1;
    transform: scale(1);
  }

  .slot .pointer-label {
    position: absolute;
    bottom: -22px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .slot.front .pointer-label.front-label {
    opacity: 1;
    color: var(--front);
  }

  .slot.rear .pointer-label.rear-label {
    opacity: 1;
    color: var(--rear);
  }

  .slot.front.rear .pointer-label {
    bottom: -22px;
  }

  /* Combined front+rear label */
  .slot.front.rear::after {
    content: 'F+R';
    position: absolute;
    bottom: -22px;
    font-size: 0.7rem;
    font-weight: 700;
    color: #f472b6;
  }

  .slot.front.rear .pointer-label {
    display: none;
  }

  /* Animation states */
  .slot.inserting-front {
    animation: slideInLeft 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .slot.inserting-rear {
    animation: slideInRight 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .slot.deleting {
    animation: popOut 0.4s cubic-bezier(0.55, 0.05, 0.65, 0.9) forwards;
  }

  @keyframes slideInLeft {
    0% { transform: translateX(-40px) scale(0.7); opacity: 0; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }

  @keyframes slideInRight {
    0% { transform: translateX(40px) scale(0.7); opacity: 0; }
    100% { transform: translateX(0) scale(1); opacity: 1; }
  }

  @keyframes popOut {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.5); opacity: 0; }
  }

  /* Pointers legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 18px;
    font-size: 0.85rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .dot.front { background: var(--front); box-shadow: 0 0 8px var(--front); }
  .dot.rear  { background: var(--rear);  box-shadow: 0 0 8px var(--rear); }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface-2);
    border-radius: 10px;
    padding: 12px 18px;
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
  }

  .status-bar span {
    color: var(--text-muted);
  }

  .status-bar strong {
    color: var(--text);
  }

  /* ===== Controls ===== */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .input-row {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  input[type="number"] {
    flex: 1;
    min-width: 140px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 1rem;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="number"]:focus {
    border-color: var(--primary);
  }

  .btn-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Inter', sans-serif;
  }

  button:active {
    transform: scale(0.97);
  }

  .btn-front {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
  }

  .btn-rear {
    background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    color: white;
  }

  .btn-del-front {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: white;
  }

  .btn-del-rear {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: white;
  }

  .btn-display {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-reset {
    background: transparent;
    color: var(--text-muted);
    border: 1px dashed var(--border);
  }

  button:hover {
    filter: brightness(1.1);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  /* ===== Log ===== */
  .log-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .log-header {
    background: var(--surface-2);
    padding: 12px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .log-body {
    height: 180px;
    overflow-y: auto;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.6;
  }

  .log-entry {
    margin-bottom: 4px;
    animation: fadeIn 0.3s ease;
  }

  .log-entry.success { color: var(--success); }
  .log-entry.error   { color: var(--danger); }
  .log-entry.info    { color: var(--primary-glow); }
  .log-entry.normal  { color: var(--text-muted); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Scrollbar */
  .log-body::-webkit-scrollbar {
    width: 6px;
  }
  .log-body::-webkit-scrollbar-track {
    background: transparent;
  }
  .log-body::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div class="made-by">Made by Nikhil Rupala</div>
      <h1>Double Ended Queue</h1>
      <p class="subtitle">Circular Array Implementation • MAX = 5</p>
      <div class="badge">Exact logic from C code</div>
    </header>

    <!-- Visualization -->
    <div class="viz-card">
      <div class="array-container" id="arrayContainer">
        <!-- slots generated by JS -->
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="dot front"></div>
          <span>Front Pointer</span>
        </div>
        <div class="legend-item">
          <div class="dot rear"></div>
          <span>Rear Pointer</span>
        </div>
      </div>

      <div class="status-bar">
        <div>
          <span>front:</span> <strong id="frontVal">-1</strong>
          &nbsp;&nbsp;
          <span>rear:</span> <strong id="rearVal">-1</strong>
        </div>
        <div>
          <span>Size:</span> <strong id="sizeVal">0</strong> / 5
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="input-row">
        <input type="number" id="valueInput" placeholder="Enter value..." autofocus>
      </div>

      <div class="btn-group">
        <button class="btn-front" onclick="insertFront()">
          ↑ Insert Front
        </button>
        <button class="btn-rear" onclick="insertRear()">
          ↓ Insert Rear
        </button>
        <button class="btn-del-front" onclick="deleteFront()">
          ← Delete Front
        </button>
        <button class="btn-del-rear" onclick="deleteRear()">
          → Delete Rear
        </button>
        <button class="btn-display" onclick="display()">
          Display
        </button>
        <button class="btn-reset" onclick="resetDeque()">
          Reset
        </button>
      </div>
    </div>

    <!-- Log -->
    <div class="log-card">
      <div class="log-header">
        <span>Operation Log</span>
        <span style="font-size:0.75rem;opacity:0.7">Matches C printf messages</span>
      </div>
      <div class="log-body" id="logBody">
        <div class="log-entry normal">Ready. Deque is empty.</div>
      </div>
    </div>

    <footer>
      Circular Array Deque • Overflow when full • Underflow when empty
    </footer>
  </div>

<script>
  const MAX = 5;
  let deque = new Array(MAX).fill(null);
  let front = -1;
  let rear = -1;

  // ---------- Helpers ----------
  function log(msg, type = 'normal') {
    const body = document.getElementById('logBody');
    const entry = document.createElement('div');
    entry.className = `log-entry ${type}`;
    entry.textContent = msg;
    body.appendChild(entry);
    body.scrollTop = body.scrollHeight;
  }

  function updateStatus() {
    document.getElementById('frontVal').textContent = front;
    document.getElementById('rearVal').textContent = rear;

    let size = 0;
    if (front !== -1) {
      if (front <= rear) size = rear - front + 1;
      else size = MAX - front + rear + 1;
    }
    document.getElementById('sizeVal').textContent = size;
  }

  function render(animType = null, animIndex = -1) {
    const container = document.getElementById('arrayContainer');
    container.innerHTML = '';

    for (let i = 0; i < MAX; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (deque[i] !== null) slot.classList.add('filled');
      if (i === front) slot.classList.add('front');
      if (i === rear) slot.classList.add('rear');
      if (front !== -1 && (
          (front <= rear && i >= front && i <= rear) ||
          (front > rear && (i >= front || i <= rear))
        )) {
        slot.classList.add('active');
      }

      // Animation class
      if (animType && i === animIndex) {
        if (animType === 'front') slot.classList.add('inserting-front');
        if (animType === 'rear')  slot.classList.add('inserting-rear');
        if (animType === 'delete') slot.classList.add('deleting');
      }

      slot.innerHTML = `
        <div class="index">[${i}]</div>
        <div class="value">${deque[i] !== null ? deque[i] : ''}</div>
        <div class="pointer-label front-label">FRONT</div>
        <div class="pointer-label rear-label">REAR</div>
      `;
      container.appendChild(slot);
    }
    updateStatus();
  }

  // ---------- Core Operations (exact C logic) ----------
  function insertFront() {
    const input = document.getElementById('valueInput');
    const x = parseInt(input.value);

    if (isNaN(x)) {
      log('Please enter a valid number', 'error');
      return;
    }

    // Overflow Check (same as C)
    if ((front === 0 && rear === MAX - 1) || (front === rear + 1)) {
      log('Deque Overflow', 'error');
      return;
    }

    if (front === -1 && rear === -1) {
      front = rear = 0;
    } else if (front === 0) {
      front = MAX - 1;
    } else {
      front--;
    }

    deque[front] = x;
    log(`${x} inserted at Front successfully.`, 'success');
    input.value = '';
    input.focus();
    render('front', front);
  }

  function insertRear() {
    const input = document.getElementById('valueInput');
    const x = parseInt(input.value);

    if (isNaN(x)) {
      log('Please enter a valid number', 'error');
      return;
    }

    // Overflow Check
    if ((front === 0 && rear === MAX - 1) || (front === rear + 1)) {
      log('Deque Overflow', 'error');
      return;
    }

    if (front === -1) {
      front = 0;
      rear = 0;
    } else {
      rear = (rear + 1) % MAX;
    }

    deque[rear] = x;
    log(`${x} inserted at Rear successfully.`, 'success');
    input.value = '';
    input.focus();
    render('rear', rear);
  }

  function deleteFront() {
    if (front === -1) {
      log('Deque Underflow', 'error');
      return;
    }

    const data = deque[front];
    const oldFront = front;

    if (front === rear) {
      front = -1;
      rear = -1;
    } else {
      front = (front + 1) % MAX;
    }

    // Animate then clear
    render('delete', oldFront);
    setTimeout(() => {
      deque[oldFront] = null;
      log(`${data} deleted from Front.`, 'info');
      render();
    }, 380);
  }

  function deleteRear() {
    if (rear === -1) {
      log('Deque Underflow', 'error');
      return;
    }

    const data = deque[rear];
    const oldRear = rear;

    if (front === rear) {
      front = -1;
      rear = -1;
    } else if (rear === 0) {
      rear = MAX - 1;
    } else {
      rear--;
    }

    render('delete', oldRear);
    setTimeout(() => {
      deque[oldRear] = null;
      log(`${data} deleted from Rear.`, 'info');
      render();
    }, 380);
  }

  function display() {
    if (front === -1) {
      log('Deque is Empty', 'error');
      return;
    }

    let result = [];
    let i = front;
    while (true) {
      result.push(deque[i]);
      if (i === rear) break;
      i = (i + 1) % MAX;
    }
    log('Deque Elements: ' + result.join(' '), 'info');
  }

  function resetDeque() {
    deque = new Array(MAX).fill(null);
    front = -1;
    rear = -1;
    document.getElementById('logBody').innerHTML = '';
    log('Deque reset. Ready.', 'normal');
    render();
  }

  // Keyboard support
  document.getElementById('valueInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') insertRear();
  });

  // Initial render
  render();
</script>
</body>
</html>
